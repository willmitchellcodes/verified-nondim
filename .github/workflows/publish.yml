# Template. To enable: copy this file to .github/workflows/publish.yml (see docs/RELEASING.md).
name: Publish to PyPI

# Runs when you publish a GitHub Release. Uses PyPI "trusted publishing": no password or
# token is stored anywhere. One-time setup on pypi.org is described in docs/RELEASING.md.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verified-nondim
    permissions:
      id-token: write   # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
