# Template. To enable: copy this file to .github/workflows/ci.yml (see docs/RELEASING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Optional second solver: its answers are certified too. The pinned commit is desr 3.0.0.
      - run: pip install "git+https://github.com/ofloveandhate/desr@deff1c066198befb3454db45c9e802c266ab19ed"
      - name: Unit tests and bridge tests that do not need Lean
        working-directory: python
        run: python -m pytest -q -m "not lean"

  lean:
    name: Lean build and bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs Lean, downloads the prebuilt Mathlib cache, and runs `lake build` in lean/.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # Optional second solver: its answers are certified too. The pinned commit is desr 3.0.0.
      - run: pip install "git+https://github.com/ofloveandhate/desr@deff1c066198befb3454db45c9e802c266ab19ed"
      - name: Lean must accept good certificates and reject corrupted ones
        working-directory: python
        run: python -m pytest -q -m lean
